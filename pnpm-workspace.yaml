packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: strict

catalog:
  '@dymo-api/better-auth': ^1.2.33
  '@types/node': ^26
  '@xcvzlabs/env': ^0.1.2
  better-auth: ^1.7.2
  drizzle-orm: 1.0.0-rc.5-5935859
  handlebars: ^4.7.9
  typescript: ^6.0.3
  unemail: ^0.7.0
  uuid: ^14.0.2
  valibot: ^1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3

overrides:
  '@nuxt/cli': alpha
  vite: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  esbuild: true
  vue-demi: true
