packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: manual

catalog:
  '@types/node': ^24
  '@xcvzlabs/env': ^0.1.2
  drizzle-orm: 1.0.0-rc.4
  typescript: ^6.0.3
  uuid: ^14.0.2
  valibot: ^1.4.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0

overrides:
  vite: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  esbuild: true
  vue-demi: true
